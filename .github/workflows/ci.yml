name: Build, Scan, and Push to ECR

on:
  workflow_run:
    workflows: ["Build"]   # must match the `name:` field inside build.yml exactly
    types:
      - completed
    branches:
      - main

jobs:
  build:
    # only proceed if the "Build" workflow (tests + SonarQube) actually
    # passed on this commit — this is what makes the ordering real,
    # not just cosmetic
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write         # required for role-to-assume (OIDC) to AWS to work at all
      security-events: write  # required to upload Snyk's SARIF results to the Security tab
    env:
      ECR_REPOSITORY: komora
      IMAGE_TAG: ${{ github.run_number }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          # pin to the EXACT commit that "Build" just tested — without
          # this, checkout would grab whatever is currently HEAD of main,
          # which could be a newer, untested commit if something else
          # landed in the meantime
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Export ECR registry to env
        run: echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Snyk container monitor (push to dashboard)
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          args: --file=Dockerfile

      - name: Snyk container test (fail build on High+)
        id: snyk-test
        continue-on-error: true
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          args: --file=Dockerfile --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk.sarif

      - name: Fail the build if Snyk found high/critical vulnerabilities
        if: steps.snyk-test.outcome == 'failure'
        run: |
          echo "Snyk found vulnerabilities at or above the severity threshold — see the Security tab for details. Blocking the push to ECR."
          exit 1

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Docker Cleanup
        if: always()
        run: |
          docker image prune -f
