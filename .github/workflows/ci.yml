name: Build, Scan, and Push to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: write
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: komora
      IMAGE_TAG: ${{ github.run_number }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Export ECR registry to env
        run: echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Snyk container monitor (push to dashboard)
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          args: --file=Dockerfile

      - name: Snyk container test (fail build on High+)
        id: snyk-test
        continue-on-error: true
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          args: --file=Dockerfile --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('snyk.sarif') != '' }}
        with:
          sarif_file: snyk.sarif

      - name: Trivy container vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate container SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: komora-${{ env.IMAGE_TAG }}.spdx.json
          artifact-name: komora-${{ env.IMAGE_TAG }}.spdx.json
          upload-artifact: true

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Verify pushed image and resolve digest
        id: image
        run: |
          set -euo pipefail
          DIGEST="$(aws ecr describe-images             --repository-name "$ECR_REPOSITORY"             --image-ids imageTag="$IMAGE_TAG"             --region "$AWS_REGION"             --query 'imageDetails[0].imageDigest' --output text)"
          test -n "$DIGEST"
          IMAGE_DIGEST="$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Verified ECR image: $IMAGE_DIGEST"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image }}
        run: cosign sign --yes "$IMAGE_DIGEST"

      - name: Verify signed image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image }}
        run: |
          cosign verify "$IMAGE_DIGEST"             --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main"             --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

      - name: Attach SBOM attestation
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image }}
        run: |
          cosign attest --yes             --predicate "komora-${IMAGE_TAG}.spdx.json"             --type spdxjson             "$IMAGE_DIGEST"

      - name: Verify SBOM attestation
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail

          ATTESTATION_FILE="$(mktemp)"
          trap 'rm -f "$ATTESTATION_FILE"' EXIT

          echo "==> Verifying SPDX attestation for $IMAGE_DIGEST"

          for attempt in 1 2; do
            echo "Attestation verification attempt $attempt/2"

            if cosign verify-attestation "$IMAGE_DIGEST"               --type spdxjson               --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main"               --certificate-oidc-issuer="https://token.actions.githubusercontent.com"               --timeout 90s               --output json > "$ATTESTATION_FILE"; then

              test -s "$ATTESTATION_FILE"
              echo "SBOM attestation verified successfully."
              exit 0
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "::warning::Cosign attestation verification did not complete on the first attempt; retrying."
              sleep 5
            fi
          done

          echo "::error::SBOM attestation verification failed after 2 attempts."
          exit 1

      - name: Trigger CD deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run cd.yml             --ref main             -f image_tag="$IMAGE_TAG"             -f run_dast=true
          echo "Triggered CD for ECR image tag: $IMAGE_TAG"

      - name: Docker Cleanup
        if: always()
        run: |
          docker image prune -f
