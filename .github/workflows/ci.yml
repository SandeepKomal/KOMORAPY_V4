name: Build, Scan, and Push to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: write
    env:
      ECR_REPOSITORY: komora
      IMAGE_TAG: \${{ github.run_number }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: \${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: \${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: \${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Export ECR registry to env
        run: echo "ECR_REGISTRY=\${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Snyk container monitor (push to dashboard)
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: \${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          image: \${{ steps.login-ecr.outputs.registry }}/\${{ env.ECR_REPOSITORY }}:\${{ env.IMAGE_TAG }}
          args: --file=Dockerfile

      - name: Snyk container test (fail build on High+)
        id: snyk-test
        continue-on-error: true
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: \${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          image: \${{ steps.login-ecr.outputs.registry }}/\${{ env.ECR_REPOSITORY }}:\${{ env.IMAGE_TAG }}
          args: --file=Dockerfile --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk.sarif

      # NOTE: this pipeline currently does NOT block the push on Snyk
      # findings — High/Critical vulnerabilities are scanned and reported
      # but do not stop the image from being pushed.

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Verify pushed image
        run: |
          set -euo pipefail
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "\${AWS_REGION:-\${{ vars.AWS_REGION }}}" >/dev/null
          echo "Verified ECR image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Trigger CD deployment
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run cd.yml \
            --ref main \
            -f image_tag="$IMAGE_TAG" \
            -f run_dast=true
          echo "Triggered CD for ECR image tag: $IMAGE_TAG"

      - name: Docker Cleanup
        if: always()
        run: |
          docker image prune -f
