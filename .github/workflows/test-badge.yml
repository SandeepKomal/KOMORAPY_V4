name: Update test count badge

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Build"]   # runs right after tests + SonarQube pass on main
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  update-badge:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests and capture the passing count
        id: tests
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee test_output.txt
          COUNT=$(grep -oE '[0-9]+ passed' test_output.txt | grep -oE '[0-9]+' | tail -1)
          COVERAGE=$(coverage report --format=total | tr -d '%' | tr -d ' ')
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"
          echo "coverage=${COVERAGE:-0}" >> "$GITHUB_OUTPUT"

      - name: Update test and coverage badges in README.md
        env:
          COUNT: ${{ steps.tests.outputs.count }}
          COVERAGE: ${{ steps.tests.outputs.coverage }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text()
          start = "<!-- quality-badges:start -->"
          end = "<!-- quality-badges:end -->"

          block = f"""<!-- quality-badges:start -->
          <p>
            <img src="https://img.shields.io/badge/tests-{os.environ["COUNT"]}%20passing-brightgreen.svg" alt="Tests: {os.environ["COUNT"]} passing">
            <img src="https://img.shields.io/badge/coverage-{os.environ["COVERAGE"]}%25-brightgreen.svg" alt="Coverage: {os.environ["COVERAGE"]}%">
          </p>
          <!-- quality-badges:end -->"""

          if start in text and end in text:
              before = text.split(start, 1)[0]
              after = text.split(end, 1)[1]
              text = before + block + after
          else:
              text = block + "\n\n" + text

          readme.write_text(text)
          PY
      - name: Check whether anything actually changed
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open (or update) a Pull Request with the updated badge
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update test and coverage badges (${{ steps.tests.outputs.count }} tests, ${{ steps.tests.outputs.coverage }}% coverage)"
          branch: update-test-badge
          delete-branch: true
          title: "📊 Update test and coverage badges"
          body: |
            Automatically updates README.md with the latest passing test count and total test coverage after the latest successful build on main.
          labels: |
            automated
            documentation
