name: Trivy Filesystem Scan

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    # daily, alongside the rest of the security chain
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  trivy-scan:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0   # report findings without failing the build — same "informational" stance as the Snyk gate

      - name: Also generate a SARIF report for the Security tab
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # ── Parse results and publish to GitHub Actions Summary ───────────
      - name: Publish results to Actions Summary
        if: always()
        run: |
          echo "## 🛡️ Trivy Filesystem Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Full results are in the attached JSON artifact, and on the [Security tab](${{ github.server_url }}/${{ github.repository }}/security/code-scanning)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy report as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-results.json
          retention-days: 90

      - name: Email Trivy report to code owners
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: KOMORA CI <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.REPORT_RECIPIENTS }}
          subject: "Trivy Filesystem Scan — ${{ github.repository }} (${{ github.ref_name }})"
          body: |
            Automated Trivy filesystem/dependency scan for commit ${{ github.sha }} on branch ${{ github.ref_name }}.

            Full findings (vulnerable dependencies and misconfigurations) are in the attached JSON file, and also visible in the repo's Security tab.

            Triggered by: ${{ github.actor }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: trivy-results.json
