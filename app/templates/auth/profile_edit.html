{% extends "base.html" %}
{% block title %}Edit profile — KOMORA{% endblock %}
{% block content %}
<main class="v-auth-wrap v-wrap">
  <div class="v-auth-card wide">
    <h1>Edit profile</h1>
    <p class="v-auth-sub">Keep your details up to date.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="v-alert {{ 'v-alert-error' if 'taken' in messages[0] or 'exists' in messages[0] else 'v-alert-success' }}">{{ messages[0] }}</div>{% endif %}
    {% endwith %}

    <form action="" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="v-field-row">
        <div class="v-field">
          <label for="username">User name</label>
          <input class="v-input" type="text" name="username" id="username" value="{{ user.username }}" required>
        </div>
        <div class="v-field">
          <label for="email">Email</label>
          <input class="v-input" type="email" name="email" id="email" value="{{ user.user_email }}" required>
        </div>
      </div>
      <div class="v-field">
        <label for="address">Address</label>
        <input class="v-input" type="text" name="address" id="address" value="{{ user.user_address }}">
      </div>
      <div class="v-field">
        <label for="mobile">Contact number</label>
        <input class="v-input" type="text" name="mobile" id="mobile" value="{{ user.user_mobile }}">
      </div>
      <div class="v-form-actions">
        <button type="submit" class="v-btn-komora block">Save changes</button>
      </div>
    </form>
  </div>
</main>
{% endblock %}
