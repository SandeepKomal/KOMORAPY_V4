apiVersion: apps/v1
kind: Deployment
metadata:
  name: komorapy
  namespace: komora
  labels:
    app.kubernetes.io/name: komorapy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: komorapy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: komorapy
    spec:
      containers:
        - name: komorapy
          image: komorapy:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: komorapy-db
            - secretRef:
                name: komorapy-app
          env:
            - name: UPLOAD_ROOT
              value: /data/uploads
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
      volumes:
        - name: uploads
          emptyDir: {}
