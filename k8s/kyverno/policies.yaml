apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: komora-require-non-root
  annotations:
    policies.kyverno.io/title: Require non-root containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - komora
      validate:
        message: "KOMORA containers must run as non-root."
        foreach:
          - list: "request.object.spec.[ephemeralContainers, initContainers, containers][]"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsNonRoot || request.object.spec.securityContext.runAsNonRoot || `false` }}"
                    operator: NotEquals
                    value: true
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: komora-disallow-privileged
  annotations:
    policies.kyverno.io/title: Disallow privileged containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: critical
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - komora
      validate:
        message: "Privileged containers are not allowed in KOMORA."
        foreach:
          - list: "request.object.spec.[ephemeralContainers, initContainers, containers][]"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.privileged || `false` }}"
                    operator: Equals
                    value: true
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: komora-disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow privilege escalation
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-no-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - komora
      validate:
        message: "KOMORA containers must disable privilege escalation."
        foreach:
          - list: "request.object.spec.[ephemeralContainers, initContainers, containers][]"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.allowPrivilegeEscalation || `false` }}"
                    operator: NotEquals
                    value: false
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: komora-require-seccomp
  annotations:
    policies.kyverno.io/title: Require RuntimeDefault seccomp
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-runtime-default-seccomp
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - komora
      validate:
        message: "KOMORA must use RuntimeDefault seccomp."
        anyPattern:
          - spec:
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: "*"
          - spec:
              containers:
                - name: "*"
                  securityContext:
                    seccompProfile:
                      type: RuntimeDefault
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: komora-require-drop-all
  annotations:
    policies.kyverno.io/title: Drop all Linux capabilities
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-drop-all-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - komora
      validate:
        message: "KOMORA containers must drop ALL Linux capabilities."
        foreach:
          - list: "request.object.spec.[ephemeralContainers, initContainers, containers][]"
            deny:
              conditions:
                all:
                  - key: ALL
                    operator: AnyNotIn
                    value: "{{ element.securityContext.capabilities.drop[].to_upper(@) || `[]` }}"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
