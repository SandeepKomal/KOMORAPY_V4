apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: komora-require-resources
  annotations:
    policies.kyverno.io/title: Require CPU and memory resources
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-requests-and-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - komora
      validate:
        message: "KOMORA containers must define CPU and memory requests and limits."
        foreach:
          - list: "request.object.spec.[ephemeralContainers, initContainers, containers][]"
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: komora-require-serviceaccount
  annotations:
    policies.kyverno.io/title: Require dedicated ServiceAccount
    policies.kyverno.io/category: Workload Identity
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-komorapy-serviceaccount
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - komora
      validate:
        message: "KOMORA pods must use the dedicated komorapy ServiceAccount."
        pattern:
          spec:
            serviceAccountName: komorapy
            automountServiceAccountToken: false
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: komora-require-image-digest
  annotations:
    policies.kyverno.io/title: Require immutable image digests
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - komora
      validate:
        message: "KOMORA images must be referenced by an immutable sha256 digest."
        foreach:
          - list: "request.object.spec.[ephemeralContainers, initContainers, containers][]"
            pattern:
              image: "*@sha256:*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: komora-disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow host namespaces
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: critical
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-host-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - komora
      validate:
        message: "KOMORA pods cannot share host namespaces."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.hostNetwork || `false` }}"
                operator: Equals
                value: true
              - key: "{{ request.object.spec.hostPID || `false` }}"
                operator: Equals
                value: true
              - key: "{{ request.object.spec.hostIPC || `false` }}"
                operator: Equals
                value: true
