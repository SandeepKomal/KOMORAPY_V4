apiVersion: v1
kind: ResourceQuota
metadata:
  name: komora-quota
  namespace: komora
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1Gi
    pods: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: komora-defaults
  namespace: komora
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
