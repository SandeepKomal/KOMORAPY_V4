# SonarQube/SonarCloud project configuration.
# Run tests + generate coverage.xml FIRST (pytest picks this up automatically
# via pytest.ini), then run sonar-scanner from this same directory:
#
#   pip install -r requirements-dev.txt
#   pytest
#   sonar-scanner
#
# (sonar-scanner itself is a separate CLI tool, not a Python package —
# install it per SonarQube's own docs: https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/scanners/sonarscanner/)

sonar.projectKey=komora_komorapy
sonar.organization=komora
# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=KOMORApy
sonar.projectVersion=1.0.0
sonar.branch.name=main

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=app
sonar.tests=tests
sonar.exclusions=app/static/**,app/templates/**
sonar.python.coverage.reportPaths=coverage.xml

# Encoding of the source code.
sonar.sourceEncoding=UTF-8

# Python version(s) this project targets — improves analysis precision
sonar.python.version=3.9,3.10,3.11,3.12

#sonar.qualitygate.wait=true
#sonar.qualitygate.timeout=300
