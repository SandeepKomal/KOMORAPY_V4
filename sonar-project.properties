# SonarQube project configuration.
# Run tests + generate coverage.xml FIRST (pytest picks this up automatically
# via pytest.ini), then run sonar-scanner from this same directory:
#
#   pip install -r requirements-dev.txt
#   pytest
#   sonar-scanner
#
# (sonar-scanner itself is a separate CLI tool, not a Python package —
# install it per SonarQube's own docs: https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/scanners/sonarscanner/)

sonar.projectKey=komora-py
sonar.projectName=KOMORA (Flask)
sonar.projectVersion=1.0

sonar.sources=app
sonar.tests=tests
sonar.exclusions=app/static/**,app/templates/**

sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12

sonar.sourceEncoding=UTF-8
